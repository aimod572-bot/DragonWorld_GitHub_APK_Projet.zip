<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon World</title>
<style>
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071326;font-family:Arial,sans-serif;color:white}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#162b52 0%,#4e89c7 55%,#d9f2ff 56%,#7fc66d 57%,#345d30 100%)}
.sun{position:absolute;width:110px;height:110px;border-radius:50%;background:#fff4a8;right:9%;top:8%;box-shadow:0 0 45px #fff}
.city{position:absolute;left:0;right:0;bottom:31%;height:25%;background:linear-gradient(90deg,#26364c 0 7%,transparent 7% 10%,#394b62 10% 17%,transparent 17% 20%,#26364c 20% 28%,transparent 28% 31%,#41556d 31% 39%,transparent 39% 42%,#27384f 42% 50%,transparent 50% 54%,#3e5067 54% 63%,transparent 63% 66%,#26384f 66% 74%,transparent 74% 78%,#40546b 78% 87%,transparent 87% 90%,#26384f 90%);opacity:.95}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:15px;z-index:10}
.box{width:42%;background:#111a2dcc;border:2px solid #fff8;border-radius:12px;padding:7px}
.name{font-weight:bold;font-size:14px;margin-bottom:5px}
.bar{height:15px;background:#301b27;border-radius:9px;overflow:hidden;border:1px solid #fff6}.hp{height:100%;background:#39df65;width:100%}.ki{height:8px;margin-top:4px;background:#26395d;border-radius:9px;overflow:hidden}.kif{height:100%;background:#22bfff;width:45%}
#msg{position:absolute;top:23%;left:50%;transform:translateX(-50%);font-size:25px;font-weight:bold;text-shadow:0 3px 5px #000;z-index:8;white-space:nowrap}
.fighter{position:absolute;bottom:30%;width:78px;height:145px;z-index:5}
#ryo{left:18%}.rival{right:18%}
.head{position:absolute;left:21px;top:0;width:36px;height:36px;border-radius:50%;background:#f0c09a;border:2px solid #222}
.body{position:absolute;left:14px;top:34px;width:50px;height:65px;border-radius:12px 12px 5px 5px;background:#1976d2;border:2px solid #111}
.leg{position:absolute;top:95px;width:22px;height:48px;background:#222;border:2px solid #111;border-radius:5px}.l1{left:15px}.l2{left:41px}
.arm{position:absolute;top:42px;width:16px;height:55px;background:#f0c09a;border:2px solid #111;border-radius:8px}.a1{left:1px;transform:rotate(12deg)}.a2{right:1px;transform:rotate(-12deg)}
.super .head:before{content:'';position:absolute;left:4px;top:-19px;width:28px;height:22px;background:#ffe45c;clip-path:polygon(0 100%,8% 20%,28% 65%,43% 0,57% 65%,80% 20%,100% 100%);}.super .body{background:#f4a300}
.controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:20}
.pad,.actions{display:flex;gap:9px;align-items:end}
button{border:2px solid #fff8;background:#10192dcc;color:#fff;border-radius:16px;min-width:62px;height:58px;font-size:14px;font-weight:bold}
button:active{transform:scale(.94);background:#1d6ca0}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#244c82,#050b16 75%);z-index:50}
#start h1{font-size:46px;margin:0 0 8px;text-shadow:0 5px 0 #000}#start p{opacity:.8}
#start button{width:220px;height:65px;font-size:20px;background:#116ba3}
@media(max-width:600px){#start h1{font-size:34px}.fighter{transform:scale(.85);transform-origin:bottom}.box{width:46%}button{min-width:52px;height:52px;font-size:12px}}
</style>
</head>
<body>
<div id="game">
<div class="sun"></div><div class="city"></div>
<div class="hud">
 <div class="box"><div class="name">RYŌZEN</div><div class="bar"><div id="hp1" class="hp"></div></div><div class="ki"><div id="ki1" class="kif"></div></div></div>
 <div class="box"><div class="name">RIVAL</div><div class="bar"><div id="hp2" class="hp"></div></div><div class="ki"><div id="ki2" class="kif"></div></div></div>
</div>
<div id="msg">PRÊT !</div>
<div id="ryo" class="fighter"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div>
<div id="enemy" class="fighter rival"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div>
<div class="controls">
 <div class="pad"><button id="left">◀</button><button id="jump">▲</button><button id="right">▶</button></div>
 <div class="actions"><button id="punch">COUP</button><button id="ki">KI</button><button id="ssj">SSJ</button></div>
</div>
<div id="start"><h1>DRAGON WORLD</h1><p>Prototype Android — Ryōzen vs Rival</p><button id="play">JOUER</button></div>
</div>
<script>
const r=document.getElementById('ryo'), e=document.getElementById('enemy'), hp1=document.getElementById('hp1'),hp2=document.getElementById('hp2'),ki1=document.getElementById('ki1'),ki2=document.getElementById('ki2'),msg=document.getElementById('msg');
let x=18,h1=100,h2=100,k1=45,k2=35,playing=false,ssj=false;
function pct(v){return Math.max(0,Math.min(100,v))+'%'}
function update(){r.style.left=x+'%';hp1.style.width=pct(h1);hp2.style.width=pct(h2);ki1.style.width=pct(k1);ki2.style.width=pct(k2)}
function hit(n){if(!playing)return;h2-=n;k1=Math.max(0,k1-5);msg.textContent='IMPACT !';update();if(h2<=0)end('VICTOIRE ! 🎉')}
function enemyAttack(){if(!playing)return;if(Math.random()<.55){h1-=8;k2=Math.max(0,k2-4);msg.textContent='RIVAL ATTAQUE !';update();if(h1<=0)end('DÉFAITE')}
}
function end(t){playing=false;msg.textContent=t;setTimeout(()=>msg.textContent='Appuie sur JOUER pour recommencer',700)}
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';playing=true;h1=100;h2=100;k1=45;k2=35;x=18;ssj=false;r.classList.remove('super');msg.textContent='COMBAT !';update()}
document.getElementById('left').onclick=()=>{if(playing)x=Math.max(4,x-3);update()}
document.getElementById('right').onclick=()=>{if(playing)x=Math.min(70,x+3);update()}
document.getElementById('jump').onclick=()=>{if(!playing)return;r.style.bottom='45%';setTimeout(()=>r.style.bottom='30%',300)}
document.getElementById('punch').onclick=()=>{if(Math.abs(x-70)<42||x>45)hit(ssj?18:12);else msg.textContent='TROP LOIN';enemyAttack()}
document.getElementById('ki').onclick=()=>{if(!playing)return;if(k1<10){msg.textContent='PAS ASSEZ DE KI';return}k1-=10;h2-=20;msg.textContent='KI BLAST ! ⚡';update();if(h2<=0)end('VICTOIRE ! 🎉');else enemyAttack()}
document.getElementById('ssj').onclick=()=>{if(!playing||ssj||k1<25)return;ssj=true;k1-=25;r.classList.add('super');msg.textContent='SUPER SAIYAN ! 🔥';update()}
update();
</script>
</body>
</html>
